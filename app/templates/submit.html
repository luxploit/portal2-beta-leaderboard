{% extends "base.html" %}
{% block title %}Submit · {{ app_name }}{% endblock %}
{% block content %}
<div class="title-row"><h1>Submit</h1></div>

{% if errors %}
<div class="notice error">
  <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
</div>
{% endif %}

<form class="form-panel" method="post" action="/submit">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>
    Category
    <select name="category_id" required>
      {% for category in categories %}
        {% if loop.first or category.build_slug != categories[loop.index0 - 1].build_slug %}
          {% if not loop.first %}</optgroup>{% endif %}
          <optgroup label="{{ category.build_name }}">
        {% endif %}
        <option value="{{ category.id }}" {% if values.category_id == category.id %}selected{% endif %}>{{ category.display_name }}</option>
        {% if loop.last %}</optgroup>{% endif %}
      {% endfor %}
    </select>
  </label>
  <label>
    Time
    <input name="run_time" value="{{ values.run_time or '' }}" placeholder="1:02:34.567" autocomplete="off" required>
  </label>
  <label>
    Video URL
    <input type="url" name="video_url" value="{{ values.video_url or '' }}" placeholder="https://youtu.be/..." maxlength="500" required>
  </label>
  <label>
    Notes <span class="muted">(optional)</span>
    <textarea name="notes" rows="4" maxlength="2000">{{ values.notes or '' }}</textarea>
  </label>
  <button type="submit">Submit</button>
</form>
{% endblock %}
