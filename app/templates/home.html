{% extends "base.html" %}
{% block title %}{{ app_name }}{% endblock %}
{% block social_meta %}<meta property="og:title" content="{{ self.title()|striptags|forceescape }}">{% endblock %}
{% block content %}
<div class="build-list">
  {% for build in builds %}
  <section class="build-group">
    <h2>{{ build.label }}</h2>
    <nav class="category-list" aria-label="{{ build.label }} categories">
      {% for category in build.categories %}
        <a href="/{{ build.slug }}/{{ category.slug }}">{{ category.display_name }}</a>
      {% endfor %}
    </nav>
  </section>
  {% endfor %}
</div>
{% endblock %}
